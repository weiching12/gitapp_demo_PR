<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14243b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="株研" />
    <meta
      name="description"
      content="株研台股研究室：用股價、KD 指標、季線與三大法人買賣量，建立自己的市場觀察。"
    />
    <title>株研 Stock Insight｜台股研究室</title>
    <script>
      try {
        const standaloneDisplay = matchMedia("(display-mode: standalone)").matches;
        if (standaloneDisplay || navigator.standalone === true)
          document.documentElement.classList.add("is-standalone");
        if (performance.getEntriesByType("navigation")[0]?.type === "reload" ||
            matchMedia("(prefers-reduced-motion: reduce)").matches)
          document.documentElement.classList.add("app-splash-seen");
      } catch {}
      try {
        if (JSON.parse(localStorage.getItem("stock-insight-v1"))?.theme === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#0b1220";
        }
      } catch {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
        font-size: 100%;
        line-height: 1.65;
      }
      .app-splash, .app-splash * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #f8fafc; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0b1220; }
      html.is-standalone:not(.app-splash-seen),
      html.is-standalone:not(.app-splash-seen) body {
        background: #14243b;
      }
      html.is-standalone:not(.app-splash-seen) #app { visibility: hidden; }
      .app-splash { display: none; }
      html.is-standalone:not(.app-splash-seen) .app-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        overflow: hidden;
        background: #14243b;
        color: #fff;
        opacity: 1;
      }
      .app-splash::before {
        content: "";
        position: absolute;
        width: min(78vw, 320px);
        aspect-ratio: 1;
        border: 1px solid rgb(147 197 253 / 12%);
        border-radius: 50%;
        box-shadow: 0 0 0 44px rgb(147 197 253 / 3%), 0 0 0 88px rgb(147 197 253 / 2%);
        animation: splash-halo 900ms ease-out both;
      }
      .app-splash-brand {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 15px;
      }
      .app-splash-mark {
        width: 76px;
        height: 76px;
        filter: drop-shadow(0 12px 24px rgb(0 0 0 / 18%));
      }
      .app-splash-mark rect { fill: #1b3150; }
      .app-splash-mark path {
        fill: none;
        stroke: #93c5fd;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 18;
        animation: splash-bars 650ms 120ms ease-out both;
      }
      .app-splash-name {
        display: grid;
        gap: 6px;
        justify-items: center;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 7px;
      }
      .app-splash-name span {
        color: #b8c9df;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 3px;
      }
      .app-splash-line {
        width: 42px;
        height: 2px;
        border-radius: 999px;
        background: #60a5fa;
        transform-origin: center;
        animation: splash-line 650ms 180ms ease-out both;
      }
      .app-splash.is-leaving .app-splash-brand {
        opacity: 0;
        transition: opacity 300ms ease;
      }
      .app-splash.is-leaving::before { opacity: 0; transition: opacity 300ms ease; }
      @keyframes splash-bars {
        from { stroke-dashoffset: 18; opacity: .25; }
        to { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes splash-line {
        from { opacity: 0; transform: scaleX(0); }
        to { opacity: 1; transform: scaleX(1); }
      }
      @keyframes splash-halo {
        from { opacity: 0; transform: scale(.82); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash, .app-splash::before,
        .app-splash-mark path, .app-splash-line {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" class="app-splash" aria-hidden="true">
      <div class="app-splash-brand">
        <svg class="app-splash-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12"></rect><path d="M10 28V19m10 9V10m10 18V15"></path></svg>
        <div class="app-splash-name">株研<span>STOCK INSIGHT</span></div>
        <div class="app-splash-line"></div>
      </div>
    </div>
    <a class="skip-link" href="#main">跳至主要內容</a>
    <div id="app"><main class="initial-load" aria-busy="true"><p role="status">正在載入股票資料…</p></main></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
