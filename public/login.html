<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>登入｜株研 Stock Insight</title>
<style>body{margin:0;background:#f8fafc;color:#14243b;font:16px/1.7 system-ui}main{max-width:420px;margin:8vh auto;padding:28px}a{color:#1d4ed8}form{display:grid;gap:18px;background:white;padding:28px;border:1px solid #e2e8f0;border-radius:16px}h1{margin-bottom:4px}label{display:grid;gap:6px}input,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:8px;min-width:0}button{background:#14243b;color:white;cursor:pointer}button:disabled{opacity:.6}#status{min-height:2em}[hidden]{display:none!important}</style></head>
<body><main><a href="/">← 返回研究工作台</a><h1>登入株研</h1><p>使用你的帳號與密碼登入。管理員可查看訪客統計及造訪紀錄。</p>
<form id="login-form"><label>帳號<input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required></label><label>密碼<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required></label><button id="submit">登入</button></form>
<p id="status" role="status" aria-live="polite"></p><p>帳號由網站維護者建立。如需帳號或重設密碼，請聯絡維護者。</p>
</main><script type="module" src="/login.js"></script></body></html>
