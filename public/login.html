<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5f7fb">
  <title>登入｜株研 Stock Insight</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-page">
    <a class="back-link" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>返回研究工作台</a>
    <section class="login-card" aria-labelledby="login-heading">
      <div class="brand" aria-label="株研 Stock Research"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 23V15m8 8V8m8 15V12"/></svg></span><div><strong>株研</strong><span>STOCK RESEARCH</span></div></div>
      <header><h1 id="login-heading">登入株研</h1></header>
      <form id="login-form">
        <label for="username">帳號</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="輸入帳號" required>
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="輸入密碼" required>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="submit" type="submit">登入<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
      </form>
      <footer>如需帳號或重設密碼，<br>請聯絡網站維護者。</footer>
    </section>
    <p class="page-caption">株研 · 台股研究室</p>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
