<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5f7fb">
  <title>設定新密碼｜株研 Stock Insight</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-page">
    <a class="back-link" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg>返回研究工作台</a>
    <section class="login-card" aria-labelledby="login-heading">
      <div class="brand" aria-label="株研 Stock Research"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 23V15m8 8V8m8 15V12"/></svg></span><div><strong>株研</strong><span>STOCK RESEARCH</span></div></div>
      <header><h1 id="login-heading">設定新密碼</h1><p>首次登入，請將臨時密碼更換為你自己的密碼。</p></header>
      <form id="change-password-form">
        <label for="password">新密碼</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="password-hint" required disabled>
        <p class="field-hint" id="password-hint">12～128 字元，請勿使用原本的臨時密碼。</p>
        <label for="confirm-password">確認新密碼</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required disabled>
        <p id="status" role="status" aria-live="polite" data-state="pending">正在確認登入狀態…</p>
        <button id="submit" type="submit" disabled>儲存新密碼</button>
      </form>
    </section>
    <p class="page-caption">株研 · 台股研究室</p>
  </main>
  <script type="module" src="/change-password.js"></script>
</body>
</html>
